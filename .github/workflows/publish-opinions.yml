name: Publish opinions

on:
  workflow_dispatch:
    inputs:
      source_dir:
        description: "Runner-local directory containing top-level opinion *.json files"
        required: true
        default: "opinions-inbox"
      branch:
        description: "Branch to update"
        required: true
        default: "main"
      dry_run:
        description: "Validate and list files without writing"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish opinions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ inputs.branch }}
        run: |
          args=("${{ inputs.source_dir }}")
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=("--dry-run")
          fi
          scripts/publish-opinions.sh "${args[@]}"
